[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrax-mcp"
dynamic = ["version"]
description = "Agentic System Telemetry, Realtime Automation & X-control: servidor MCP que da ojos y manos a tu IA"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "ai-agents", "automation", "pyautogui", "computer-use"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    # <2: misma restricción que usaba mcp_settings.json. El código ya es compatible con
    # el SDK v2 (MCPServer); quita el tope cuando lo hayas probado.
    "mcp[cli]>=1.2.0,<2",
    "pyautogui>=0.9.54",
    "Pillow>=10.0.0",
    "pyperclip>=1.8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/AstraxOf/astrax-mcp"
Telegram = "https://t.me/AstraxMCP"
YouTube = "https://youtube.com/@AstraxOf"

[project.scripts]
astrax-mcp = "astrax_mcp:main"
astrax-install = "astrax_mcp.installer:main"

[tool.hatch.version]
path = "src/astrax_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/astrax_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "install.py", "README.md", "pyproject.toml", "requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
